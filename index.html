<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stim">
<meta name="theme-color" content="#5b3df5">
<meta name="description" content="Earn your scroll time. A short challenge for your body or your mind unlocks 30 minutes of social media.">
<title>Stim</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="view" tabindex="-1"></main>

<nav class="tabs" id="tabs" aria-label="Sections">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>Today</a>
  <a href="#/learn" data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.500C6.500 4.500 9.500 4.800 12 6.500c2.500-1.700 5.500-2 8-1V18c-2.500-1-5.500-.7-8 1-2.500-1.700-5.500-2-8-1ZM12 6.500V19"/></svg>Learn</a>
  <a href="#/friends" data-tab="friends"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c.5-4 3-6 6.500-6s6 2 6.500 6M16 5.500a3 3 0 0 1 0 5.500M18 14.500c2 .8 3.200 2.600 3.500 5.500"/></svg>Friends</a>
  <a href="#/me" data-tab="me"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="14" height="14" rx="5"/><path d="M9.500 12h.01M14.500 12h.01M10 15.500q2 1.500 4 0M9 6 8 3M15 6l1-3"/></svg>Me</a>
  <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</a>
</nav>

<!-- Camera stage: every exercise runs here -->
<section id="stage" class="stage" hidden aria-label="Camera exercise tracker">
  <div class="stage-video"><video id="video" playsinline muted></video><canvas id="canvas"></canvas></div>
  <div class="stage-top">
    <button class="xbtn glass" id="camClose" type="button" aria-label="Pause">✕</button>
    <div class="pbar on-dark"><i id="camBar"></i></div>
    <span class="glass chip" id="camStep"></span>
  </div>
  <div class="stage-hint glass" id="camHint" hidden></div>
  <div class="stage-dock">
    <div class="dockcard glass">
      <div id="camRing"></div>
      <div class="dock-main">
        <p class="dock-label" id="camLabel"></p>
        <p class="cue idle" id="camCue">Get in position</p>
        <div class="meter" id="camMeterBox" aria-hidden="true"><i id="camMeter"></i><span class="mk" id="mkDown"></span><span class="mk" id="mkUp"></span></div>
      </div>
    </div>
  </div>
  <div class="stage-over" id="camRest" hidden><p class="over-kicker">Rest</p><p class="over-big" id="camRestN">0:20</p><p class="over-sub" id="camRestNext"></p></div>
  <div class="stage-over" id="camPaused" hidden>
    <p class="over-big small">Paused</p>
    <button class="btn primary" id="camResume" type="button">Keep going</button>
    <button class="btn ghost-light" id="camManual" type="button">Camera not tracking? Finish without it</button>
    <button class="btn ghost-light" id="camQuit" type="button">Quit</button>
  </div>
</section>

<canvas id="confetti" aria-hidden="true"></canvas>

<!-- Skip sheet -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" data-step="1" role="dialog" aria-modal="true" aria-labelledby="sheetQ" hidden>
  <div class="sheetcard">
    <div class="grab" aria-hidden="true"></div>
    <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
    <h3 id="sheetQ">Are you sure?</h3>
    <p id="sheetSub"></p>
    <div class="sheet-row">
      <button class="btn primary" id="sheetNo" type="button">I'll do one</button>
      <button class="btn warn" id="sheetYes" type="button">Yes, skip</button>
    </div>
  </div>
</div>

<noscript><p style="padding:24px">Stim needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
