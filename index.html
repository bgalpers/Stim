<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stim">
<meta name="theme-color" content="#10382a">
<meta name="description" content="Earn your scroll time. A short challenge for your body or your mind unlocks 30 minutes of social media.">
<title>Stim</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="view" tabindex="-1"></main>

<nav class="tabs" id="tabs" aria-label="Sections">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V10M12 14c-4 0-6-2.5-6-6 4 0 6 2.500 6 6Zm0-3c0-4 2.500-6.500 6.500-6.500C18.500 8.500 16 11 12 11Z"/></svg>Today</a>
  <a href="#/learn" data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.500C6.500 4.500 9.500 4.800 12 6.500c2.500-1.700 5.500-2 8-1v12.500c-2.500-1-5.500-.7-8 1-2.500-1.700-5.500-2-8-1ZM12 6.500V19"/></svg>Learn</a>
  <a href="#/progress" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Progress</a>
  <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</a>
</nav>

<!-- Camera rep counter -->
<section id="stage" class="stage" hidden aria-label="Camera rep counter">
  <div class="stage-video"><video id="video" playsinline muted></video><canvas id="canvas"></canvas></div>
  <div class="stage-top">
    <button class="glass chip" id="camPause" type="button">Pause</button>
    <span class="glass chip num" id="camAngle">—°</span>
  </div>
  <div class="stage-hint glass" id="camHint" hidden></div>
  <div class="stage-dock">
    <div class="dockcard glass">
      <div class="ring ring-sm" id="camRing"></div>
      <div class="dock-main">
        <p class="cue idle" id="camCue">Get in position</p>
        <div class="meter" aria-hidden="true"><i id="camMeter"></i><span class="mk" id="mkDown"></span><span class="mk" id="mkUp"></span></div>
      </div>
    </div>
  </div>
  <div class="stage-paused" id="camPaused" hidden>
    <p>Paused</p>
    <button class="btn primary" id="camResume" type="button">Resume</button>
    <button class="btn ghost-light" id="camExit" type="button">Count by tapping instead</button>
  </div>
</section>

<!-- Skip sheet -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" data-step="1" role="dialog" aria-modal="true" aria-labelledby="sheetQ" hidden>
  <div class="sheetcard">
    <div class="grab" aria-hidden="true"></div>
    <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
    <h3 id="sheetQ">Are you sure?</h3>
    <p id="sheetSub"></p>
    <div class="sheet-row">
      <button class="btn primary" id="sheetNo" type="button">I'll do one</button>
      <button class="btn warn" id="sheetYes" type="button">Yes, skip</button>
    </div>
  </div>
</div>

<noscript><p style="padding:24px">Stim needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
